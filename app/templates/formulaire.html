<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ajouter un produit</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width:500px">
  <h1 class="mb-4">Ajouter un produit</h1>

  <!-- permet d'afficher les éventuels messages flash envoyés par le backend et vide la pile
   Impossible donc d'afficher 2 fois un message même en rafraîchissant -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    <!-- with_categories=true permet de renvoyer une liste de tuples (message, categorie)  -->
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }}">{{ msg }}</div>
    {% endfor %}
  {% endwith %}

  <form method="POST" action="{{ url_for('main.ajouter') }}">  
    <!-- La route /ajouter est appelée à la soumission du formulaire -->
    <div class="mb-3">
      <label class="form-label">Nom du produit</label>
      <input type="text" name="nom" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Prix (€)</label>
      <input type="number" name="prix" step="0.01" min="0" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Stock</label>
      <input type="number" name="stock" min="0" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Ajouter</button>
    <a href="{{ url_for('main.liste') }}" class="btn btn-secondary w-100 mt-2">Voir la liste</a>
  </form>
</div>
</body>
</html>
