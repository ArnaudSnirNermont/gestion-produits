<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Liste des produits</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1>Liste des produits</h1>
    <a href="{{ url_for('main.ajouter') }}" class="btn btn-primary">+ Ajouter</a>
  </div>

  {% if produits %}
  <table class="table table-striped table-hover shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Nom</th>
        <th>Prix (€)</th>
        <th>Stock</th>
      </tr>
    </thead>
    <tbody>
      {% for p in produits %}
      <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.nom }}</td>
        <td>{{ "%.2f"|format(p.prix) }}</td>
        <td>
          <span class="badge {% if p.stock == 0 %}bg-danger{% elif p.stock < 5 %}bg-warning text-dark{% else %}bg-success{% endif %}">
            {{ p.stock }}
          </span>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div class="alert alert-info">Aucun produit enregistré.</div>
  {% endif %}
</div>
</body>
</html>
